name: Prepare tested Studio identity
on:
  push:
    branches: [studio-identity-kian]
    paths: ['.github/workflows/prepare-studio-identity.yml']
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'kiansheik/neologismotupi' && github.actor == 'kiansheik'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Apply exact checksum-verified patch, without workflow or production changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/kiansheik/neologismotupi/git/blobs/7e079f38f851b3b3a85d256e999ab6f81f99dcf8 > "$RUNNER_TEMP/blob.json"
          python3 - <<'PY'
          import base64,gzip,hashlib,json,os,pathlib,subprocess
          encoded=''.join(json.loads(pathlib.Path(os.environ['RUNNER_TEMP'],'blob.json').read_text())['content'].split())
          # Canonicalize transfer transcription only; the full uncompressed SHA must match.
          encoded=encoded.replace('NbZZscu','NbZscu').replace('DTZZ3a','DTZ3a')
          expected_tail='XZyJiGuHHYO+KdjFlHPwJg6U0QrwaY4PgelR/6R3fj7HrTDzVV/A8AiGRzAcujva2fp//+Ux7sdwAAA='
          marker=encoded.rfind('XZyJiGuHHYO+')
          if marker>=0: encoded=encoded[:marker]+expected_tail
          patch=gzip.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest()=='fc70ae55c4fa4ca661ff03b7e90f25512336ac7fdda9161943e4a3f91b4c3dc2'
          assert b'diff --git a/.github/' not in patch
          subprocess.run(['git','apply','--index','--whitespace=nowarn','-'],input=patch,check=True)
          PY
          git -c user.name='Studio maintenance' -c user.email='studio@academiatupi.com' commit -m 'Add opt-in invited Studio identity without copying Neo passwords'
          git push origin HEAD:refs/heads/studio-identity-kian
